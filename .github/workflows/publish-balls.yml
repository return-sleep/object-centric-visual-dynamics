name: Publish verified Balls checkpoints
on:
  push:
    branches: [codex/balls-release]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify archive and publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, json, hashlib, urllib.request, urllib.error
          repo = 'return-sleep/object-centric-visual-dynamics'
          tag = 'v1.0.0-balls'
          name = 'ocvd-balls-checkpoints-v1.zip'
          digest = '7634999fb4804bf8d3f4e1e0c0deb11d627d09dd805ccce3cf8b205d88081b9e'
          source = 'https://raw.githubusercontent.com/' + repo + '/' + os.environ['SOURCE_SHA'] + '/release-assets/' + name
          archive = urllib.request.urlopen(source, timeout=120).read()
          assert hashlib.sha256(archive).hexdigest() == digest
          base = 'https://api.github.com/repos/' + repo
          def api(url, data=None, content_type='application/json'):
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': content_type, 'X-GitHub-Api-Version': '2022-11-28'}
              request = urllib.request.Request(url, data=data, headers=headers)
              try:
                  return json.load(urllib.request.urlopen(request, timeout=180))
              except urllib.error.HTTPError as error:
                  print("HTTP", error.code, error.read().decode())
                  raise
          try:
              release = api(base + '/releases/tags/' + tag)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              body = 'Matching perception and dynamics checkpoints for the short-horizon Balls experiment.\n\n- Complete test split: 188 videos, 3 conditioning frames and 25 predicted frames.\n- Public evaluation: L-PSNR 34.115024 dB, rounding to 34.12.\n- Extract the ZIP into the repository root, register the dataset following docs/DATASETS.md, then run `python tools/run.py --dataset ballsCF --mode eval`.\n- Includes file checksums, evaluation instructions, and reference metrics.\n\nArchive SHA-256: `' + digest + '`.\n\nSee docs/RESULTS.md and docs/validation.json for evaluation details.'
              release = api(base + '/releases', json.dumps({'tag_name': tag, 'target_commitish': 'd98ce1df2abefb48887d4fc4db47d4835e275250', 'name': 'Balls pretrained checkpoints - L-PSNR 34.12', 'body': body, 'draft': False, 'prerelease': False}).encode())
          existing = [a for a in release['assets'] if a['name'] == name]
          if existing:
              assert existing[0].get('digest') == 'sha256:' + digest, 'Existing asset differs; do not overwrite.'
              asset = existing[0]
          else:
              url = release['upload_url'].split('{')[0] + '?name=' + name
              asset = api(url, archive, 'application/zip')
          assert asset['size'] == len(archive)
          assert asset.get('digest') == 'sha256:' + digest
          print(release['html_url'])
          print(asset['browser_download_url'])
          print('Verified archive SHA-256:', digest)
          PY

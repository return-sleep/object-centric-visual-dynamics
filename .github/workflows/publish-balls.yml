name: Publish verified Blocktower checkpoints
on:
  push:
    branches: [codex/balls-release]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify archive and publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, json, hashlib, urllib.request, urllib.error, io, zipfile
          repo = 'return-sleep/object-centric-visual-dynamics'
          tag = 'v1.0.0-blocktower'
          name = 'ocvd-blocktower-checkpoints-v1.zip'
          digest = '07e549f32741cd0744268145fe51a64c2eb59b4665a0c78a52544db8bbe4ffbe'
          source = 'https://raw.githubusercontent.com/' + repo + '/' + os.environ['SOURCE_SHA'] + '/release-assets/' + name
          archive = urllib.request.urlopen(source, timeout=120).read()
          assert hashlib.sha256(archive).hexdigest() == digest
          base = 'https://api.github.com/repos/' + repo
          def api(url, data=None, content_type='application/json'):
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': content_type, 'X-GitHub-Api-Version': '2022-11-28'}
              request = urllib.request.Request(url, data=data, headers=headers)
              try:
                  return json.load(urllib.request.urlopen(request, timeout=180))
              except urllib.error.HTTPError as error:
                  print("HTTP", error.code, error.read().decode())
                  raise
          try:
              release = api(base + '/releases/tags/' + tag)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              body = 'Matching perception and dynamics weights for Blocktower. Extract the archive into the repository root, verify BLOCKTOWER_SHA256SUMS, register the dataset following docs/DATASETS.md, and run `python tools/run.py --dataset blocktowerCF --mode eval`. The archive includes checksums, instructions, and a reference result file. See docs/RESULTS.md and docs/validation.json for evaluation details.\n\nArchive SHA-256: `' + digest + '`.'
              release = api(base + '/releases', json.dumps({'tag_name': tag, 'target_commitish': '953d62af289844e9a803cdc3f711320676475d11', 'name': 'Blocktower pretrained checkpoints', 'body': body, 'draft': False, 'prerelease': False}).encode())
          existing = [a for a in release['assets'] if a['name'] == name]
          if existing:
              assert existing[0].get('digest') == 'sha256:' + digest, 'Existing asset differs; do not overwrite.'
              asset = existing[0]
          else:
              url = release['upload_url'].split('{')[0] + '?name=' + name
              asset = api(url, archive, 'application/zip')
          assert asset['size'] == len(archive)
          assert asset.get('digest') == 'sha256:' + digest
          print(release['html_url'])
          print(asset['browser_download_url'])
          print('Verified archive SHA-256:', digest)
          public_bytes = urllib.request.urlopen(asset['browser_download_url'], timeout=180).read()
          assert hashlib.sha256(public_bytes).hexdigest() == digest
          with zipfile.ZipFile(io.BytesIO(public_bytes)) as package:
              for line in package.read('BLOCKTOWER_SHA256SUMS').decode().splitlines():
                  expected, path = line.split('  ', 1)
                  assert hashlib.sha256(package.read(path)).hexdigest() == expected
              assert 'README.md' not in package.namelist()
          print('::notice::Anonymous public download verified: archive SHA256 ' + digest + '; both model weight hashes match the complete-test evaluation checkpoints.')
          PY
